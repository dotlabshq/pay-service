[app]
name  = "pay-service"
image = "ghcr.io/dotlabshq/pay-service:0.1.0"

# pay-service = the payment-collection capability lego (ADR-010). Org-scoped over
# the shared foldbase (tenant = org id, set per request); verifies membership via
# org-service and resolves the customer via customers-service. Charges are
# idempotent by the caller's idempotency key. Built-in providers: manual + mock;
# real gateways (Stripe, …) plug in as more providers.
[env]
# FOLDBASE_SERVICE_URL, FOLDBASE_TOKEN — injected at deploy.
# ORG_SERVICE_URL, CUSTOMERS_SERVICE_URL — injected via service bindings.
# INVOICE_SERVICE_URL (optional) — invoice-service, to show the invoice a payment settles.
# AUTH_URL, AUTH_JWKS_URI, AUTH_ISSUER, AUTH_AUDIENCE — the realm's auth-service (bwt_ exchange, token verification).
# PAY_SERVICE_CLIENT_SECRET — this service's secret at auth-service (`pay:<secret>` in AUTH_SERVICE_CLIENTS there);
#   with it the service registers its actions with org-service. PAY_PERMISSION_CACHE_SECONDS (15) is optional.
