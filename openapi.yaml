openapi: 3.1.0
info:
  title: pay-service
  version: "1.0"
  description: |
    Money collected. One record per charge, scoped to an organization.

    **A charge is idempotent by key.** `idempotency_key` is hashed into the
    stream id, so re-sending the same key returns the charge that already
    exists rather than taking the money twice. A network that times out after
    the charge succeeded is the normal case, not the exotic one.

    **Providers.** `manual` and `mock` resolve synchronously here — `manual` is
    money that arrived some other way and is being written down, `mock` is for
    exercising a flow. `stripe` means the charge already happened off-band, and
    the caller supplies the outcome for this service to record as it was; a
    service that did not run the charge must not invent its result.

    Nothing here knows what anything costs. That is catalog's and invoice's
    business; this service records what was collected.

    **Every request names an org.** `X-Org-Id` carries it — an id, a slug or a
    short id — and `requireOrg` asks org-service whether the caller is a member.
    The resolved org id is also the storage tenant.

    **Who may.** What a caller may do is org-service's to say: this service
    registers two actions with it, `payment.read` and `payment.charge`, and each
    route names the one it needs (403 `forbidden`, with `permission`, when the
    caller lacks it; 502 `authz_unavailable` when org-service cannot be asked).
    A credential limited to `read` can never charge. The bearer is a realm token
    or a `bwt_` API token, which is exchanged at auth-service.

    **snake_case.** Every field is snake_case on the wire. Requests are still
    read in the camelCase spelling this service used before 0.3.0
    (`customerId`, `amountCents`, …); answers are snake_case only.

    Routes live under `/api`; a gateway publishes them at `/v1/pay/...` and
    replaces that prefix (workspace ADR 0003). The same routes are still mounted
    at the service root and under `/v1`, as legacy aliases for callers that
    predate `/api`. `/healthz` is at the root only.

servers:
  - url: https://example.com/v1/pay
    description: Behind a gateway
  - url: http://127.0.0.1:3011/api
    description: Direct, for local development

tags:
  - name: discovery
  - name: payments

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [discovery]
      summary: Liveness
      security: []
      responses:
        "200": { description: ok }

  /.well-known/service:
    get:
      tags: [discovery]
      summary: What this service is
      security: []
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceManifest" }

  /payments:
    get:
      tags: [payments]
      summary: List charges
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: customer_id, in: query, schema: { type: string }, description: Only this customer's payments. `customer` is the same, as it used to be. }
        - { name: customer, in: query, schema: { type: string }, deprecated: true }
      responses:
        "200":
          description: Charges, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "400": { description: org_required — no X-Org-Id }
        "403": { description: Not a member of this org, or no `payment.read` }
        "502": { description: authz_unavailable — org-service could not be asked }
    post:
      tags: [payments]
      summary: Charge
      description: |
        Idempotent by `idempotency_key`: the same key answers with the charge
        that already exists, with the status it already had. Choose a key that
        identifies the attempt — an invoice id and a sequence, say — not a
        random one per request, or a retry becomes a second charge.

        `invoice_id` is what this is being collected against, if anything.
        pay-service does not check it against invoice-service; whoever is
        reconciling the two owns that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, amount_cents, currency, idempotency_key]
              properties:
                customer_id:
                  type: string
                  description: A customer reference, resolved against customers-service.
                amount_cents: { type: integer, minimum: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                invoice_id: { type: string }
                provider: { $ref: "#/components/schemas/Provider" }
                idempotency_key: { type: string }
                simulate_failure:
                  type: boolean
                  description: Built-in providers only. Makes the charge fail, for exercising the unhappy path.
                status:
                  $ref: "#/components/schemas/Status"
                  description: |
                    External providers only. The outcome that already happened,
                    recorded as given.
                provider_ref: { type: string }
                failure_reason: { type: string }
      responses:
        "201":
          description: Charged — or the charge this key already made
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
        "400": { description: Malformed body, or a non-positive amount }
        "403":
          description: |
            No `payment.charge` permission (a read-only credential, a viewer),
            or `status`, `provider_ref` and `failure_reason` set by a caller that
            is not a service: they assert that money already changed hands
            elsewhere, and a person, agent or key that could would be writing a
            succeeded payment without collecting.
        "404": { description: customer_not_found }
        "502": { description: authz_unavailable, or customers_unavailable }

  /payments/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
        description: The id, the short id, or the idempotency key.
    get:
      tags: [payments]
      summary: One charge
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
        "403": { description: Not a member of this org, or no `payment.read` }
        "404": { description: No such charge in this org }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Status:
      type: string
      enum: [succeeded, failed]

    Provider:
      type: string
      enum: [manual, mock, stripe]

    Payment:
      type: object
      required: [id, short_id, amount_cents, currency, status, provider]
      properties:
        id: { type: string }
        short_id: { type: string }
        customer_id: { type: string }
        customer_name:
          type: [string, "null"]
          description: As it was when the charge was recorded.
        amount_cents: { type: integer }
        currency: { type: string }
        invoice_id: { type: [string, "null"] }
        provider: { $ref: "#/components/schemas/Provider" }
        provider_ref: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/Status" }
        failure_reason: { type: [string, "null"] }
        idempotency_key: { type: string }
        created_at: { type: integer }

    ServiceManifest:
      type: object
      required: [name, version, api_version]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string }
        openapi_url: { type: string }
        capabilities:
          type: array
          items: { type: string }
